name: unity_flutter
description: Editable BlockLab Flutter shell and embedded Unity workspace.
publish_to: none
version: 1.0.0+1
environment:
  sdk: ^3.11.0
dependencies:
  flutter:
    sdk: flutter
  flutter_embed_unity: 1.4.0
  isar_community: 3.4.1
  isar_community_flutter_libs: 3.4.1
  path_provider: ^2.1.1
  shared_preferences: ^2.5.3
  share_plus: 11.1.0
  file_picker: 10.3.10
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  isar_community_generator: 3.4.1
  build_runner: ^2.10.4
flutter:
  uses-material-design: true
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-400.ttf
          weight: 400
        - asset: assets/fonts/Nunito-600.ttf
          weight: 600
        - asset: assets/fonts/Nunito-700.ttf
          weight: 700
        - asset: assets/fonts/Nunito-800.ttf
          weight: 800
  assets:
    - assets/fonts/OFL.txt
    - assets/images/logo_blocklab.png
    - assets/images/guides/
    - assets/images/lesson3/
    - assets/images/lesson4/
    - assets/images/lesson5/
    - assets/images/lesson6/
    - assets/images/lesson7/
    - assets/lessons/catalog.json
